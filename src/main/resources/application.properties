# 应用服务 WEB 访问端口
server.port=8080
# 应用服务名称
spring.application.name=yc-page

# 微信相关配置
wechat.token=${YC_WECHAT_TOKEN}
wechat.encodingAesKey=${YC_WECHAT_ENCODINGAESKEY}
mini.appid=${YC_WECHAT_MINI_APPID}
mini.secret=${YC_WECHAT_MINI_APPSECRET}

# 小程序一次性订阅消息
# 评论留言通知：有人评论自己的打卡分享时提醒记录主人
mini.subscribe.comment-template-id=${YC_MINI_SUBSCRIBE_COMMENT_TEMPLATE_ID:xlo0VMrryhvUtwlM105V6W4HUe-XjL-IN__L4HLa8O8}
# 评论回复通知：自己的评论被回复时提醒被回复人
mini.subscribe.reply-template-id=${YC_MINI_SUBSCRIBE_REPLY_TEMPLATE_ID:qa_NMLMZi-UzAkrC4NCspsfzLTynm3Hq9J3vyEOBV58}
# 订阅消息打开的小程序版本：formal-正式版 developer-开发版 trial-体验版
mini.subscribe.state=${YC_MINI_SUBSCRIBE_STATE:formal}

# Redis
spring.data.redis.host=${YC_REDIS_HOST:127.0.0.1}
spring.data.redis.port=6379
spring.data.redis.password=${YC_REDIS_PASSWORD:}
spring.data.redis.database=${YC_REDIS_DATABASE:0}
spring.cache.redis.time-to-live= 1800000

# Mysql
spring.datasource.url=jdbc:mysql://${YC_MYSQL_HOST:127.0.0.1}:3306/yc_page?characterEncoding=utf-8&useSSL=false&allowMultiQueries=true
spring.datasource.username=${YC_MYSQL_USERNAME:root}
spring.datasource.password=${YC_MYSQL_PASSWORD:ikun008}

# Mybatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=ASSIGN_ID
