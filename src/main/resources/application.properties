# \u5E94\u7528\u670D\u52A1 WEB \u8BBF\u95EE\u7AEF\u53E3
server.port=8080
# \u5E94\u7528\u670D\u52A1\u540D\u79F0
spring.application.name=yc-page

# \u7981\u7528\u65F6\u95F4\u6233\u683C\u5F0F # \u7EDF\u4E00\u65E5\u671F\u683C\u5F0F # \u8BBE\u7F6E\u65F6\u533A
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# \u5FAE\u4FE1\u76F8\u5173\u914D\u7F6E
wechat.token=${YC_WECHAT_TOKEN}
wechat.encodingAesKey=${YC_WECHAT_ENCODINGAESKEY}
mini.appid=${YC_WECHAT_MINI_APPID}
mini.secret=${YC_WECHAT_MINI_APPSECRET}

# Redis
spring.redis.host=${YC_REDIS_HOST:127.0.0.1}
spring.redis.port=6379
spring.redis.password=${YC_REDIS_PASSWORD:}
spring.redis.database=${YC_REDIS_DATABASE:0}
spring.cache.redis.time-to-live= 1800000

# Mysql
spring.datasource.url=jdbc:mysql://${YC_MYSQL_HOST:127.0.0.1}:3306/yc_page?characterEncoding=utf-8&useSSL=false&allowMultiQueries=true
spring.datasource.username=${YC_MYSQL_USERNAME:root}
spring.datasource.password=${YC_MYSQL_PASSWORD:ikun008}

# Mybatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=ASSIGN_ID

# swagger\u914D\u7F6E
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# false\u5173\u95EDswagger\u6587\u6863 true\u6253\u5F00swagger(\u751F\u4EA7\u670D\u52A1\u5668\u6CE8\u610F\u5173\u95EDswagger\u6587\u6863)
springfox.documentation.auto-startup=false
