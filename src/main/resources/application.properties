# 应用服务 WEB 访问端口
server.port=8080
# 应用服务名称
spring.application.name=yc-page

# 微信相关配置
wechat.token=${YC_WECHAT_TOKEN}
wechat.encodingAesKey=${YC_WECHAT_ENCODINGAESKEY}

# Redis
spring.redis.host=${YC_REDIS_HOST:127.0.0.1}
spring.redis.port=6379
spring.redis.password=${YC_REDIS_PASSWORD:}
spring.redis.database=${YC_REDIS_DATABASE:0}
spring.cache.redis.time-to-live= 1800000

# Mysql
spring.datasource.url=jdbc:mysql://${YC_MYSQL_HOST:127.0.0.1}:3306/yc_page?characterEncoding=utf-8&useSSL=false
spring.datasource.username=${YC_MYSQL_USERNAME:root}
spring.datasource.password=${YC_MYSQL_PASSWORD:ikun008}

# Mybatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=ASSIGN_ID

# swagger配置
spring.mvc.pathmatch.matching-strategy=ant_path_matcher